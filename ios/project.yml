# Nacre 运行时的工程（XcodeGen）
#
# 这个工程**只有运行时**，它就是交付物 Nacre.xcframework 的源。
# 验收 App 在 acceptance/ios/，它把这个工程当子工程引进去。
#
# 生成工程：xcodegen generate
name: Nacre

options:
  bundleIdPrefix: com.orbitlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  # 运行时。它就是交付物 Nacre.xcframework 的源——凡是这个 target 里的
  # 文件，用户都会拿到；App 那个 target 里的不会。
  #
  # 先做成 dynamic framework：资源（Builtin/nacre.js）跟着 framework 走，
  # 定位是确定的。static 的启动和体积可能更好，但两样都没有数据，等这一步
  # 量出来再对比。
  Nacre:
    type: framework
    platform: iOS
    sources:
      # 两个公开头单独列（见下），所以这里先排除掉
      - path: Runtime
        excludes:
          - "Builtin/**"
          - "Nacre.h"
          - "NacreRuntime.h"
          - "PrivacyInfo.xcprivacy"
        headerVisibility: project
      - path: Runtime/Nacre.h
        headerVisibility: public
      - path: Runtime/NacreRuntime.h
        headerVisibility: public
      # 内置脚本，在 main.js 之前执行。打进 framework 自己的包，
      # 运行时用 bundleForClass: 找它
      - path: Runtime/Builtin
        type: folder
        buildPhase: resources
      # 隐私清单。Apple 要求它在 framework 包的**根**，而且第三方 SDK 不能
      # 靠宿主 App 的那一份来报自己——所以它必须跟着这个 target 走。
      # 内容是 nm 实测出来的，check-api.sh 会核对符号和声明对不对得上。
      - path: Runtime/PrivacyInfo.xcprivacy
        buildPhase: resources
    # 系统框架在这里显式声明。
    #
    # 以前不用写：App target 里有 Swift 文件 import UIKit，顺带把 UIKit 和
    # QuartzCore 链进来了。运行时里**一个 Swift 文件都没有**，而 ObjC++ 的
    # #import 不触发自动链接，所以全部要列出来——第一次编 framework 就撞了
    # 一屏 Undefined symbols。
    #
    # 这张表就是交付清单的一部分：用户的工程不用再写它们，framework 自带。
    dependencies:
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      # CGRectZero 这类符号在 CoreGraphics 里，UIKit 只是把头转出来
      - sdk: CoreGraphics.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitlabs.nacre.runtime
        # 生成 module map，宿主才能 import Nacre
        DEFINES_MODULE: YES
        # Info.plist 让 Xcode 自己生成，不往运行时目录里放生成物——
        # 这个目录是交付面，里面的东西都会被用户拿到
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # C++ / V8。这些只有运行时需要，宿主工程不用配
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-fno-rtti"]
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/v8/include"]
        # 按平台选择 V8 静态库：Vendor/v8/lib/iphoneos 或 Vendor/v8/lib/iphonesimulator
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/v8/lib/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
          # Chromium 的 zlib（V8 的快照校验和反优化数据解压依赖它）
          - "-lzip"
          - "-lv8_libbase"
          - "-lv8_libplatform"
          - "-lv8_base_without_compiler"
          - "-lv8_compiler"
          - "-lv8_bigint"
          - "-lv8_snapshot"
          - "-lv8_third_party"
          - "-lcppgc_base"
          - "-ltorque_generated_initializers"
          - "-ltorque_generated_definitions"
          - "-lv8_heap_base"
          - "-lcrdtp"
          - "-lcrdtp_platform"
          - "-linspector"
          - "-linspector_string_conversions"

settings:
  base:
    # 只支持 arm64（真机 + Apple Silicon 模拟器）
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
