# 每个 PR 上跑的检查。分两段：
#   static  不用编译的：类型检查、各组用例、文档链接。在 Linux 上跑——Mac 的机器
#           常常排不上（第一次开 PR 时两个任务都因为分不到机器被取消了），
#           这一段不该被它拖住
#   build   三边核对；用 Xcode 26 把运行时和能力包从源码编出来，再照用户的走法
#           演练一遍。只能在 Mac 上跑
#
# 发出去的包是用 Xcode 26 编的（见 release.yml），所以 PR 上就先编一遍。
# 完整的验收（六千条断言，要模拟器、要点权限弹窗）不在这里跑，发布前在本地跑。
name: check

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 验收套件：类型检查和 runner 的用例
        working-directory: acceptance
        run: |
          npm ci
          npm run check
          npm test
      - name: 示例：类型检查
        working-directory: examples/hello
        run: |
          npm ci
          npx tsc --noEmit
      - name: 命令行工具的用例
        working-directory: packages/cli
        run: npm test
      - name: 发布脚本的用例
        run: node --test scripts/test/*.test.mjs
      - name: 文档链接
        run: bash docs/check-links.sh
      # shell 脚本里 $变量 后面紧跟中文字符：macOS 自带的 bash 3.2 会把那几个字节
      # 读进变量名，set -u 下脚本当场退出。要写成 ${变量}
      - name: shell 脚本里没有紧跟中文的 $变量
        # 用 perl 不用 grep -P：macOS 的 grep 没有 -P，而 grep 出错和「没找到」在 if 里
        # 分不清，检查会悄悄通过。perl 自己出错时退出码非零，这一步会失败
        run: >-
          perl -ne 'if (/\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]/) { print "::error file=$ARGV,line=$.::\$变量 后面紧跟中文字符，改成 \${变量}\n"; $bad = 1 }
          close ARGV if eof; END { exit($bad ? 1 : 0) }' ios/scripts/*.sh scripts/*.sh

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 用 GitHub 默认装齐了的那个 Xcode 26（现在是 26.6），写死版本号，换版本要改这里。
      # 原来用支持的最老的 26.0，但这台机器上 26.0 的 iOS 平台组件不一定装着：同样的
      # 26.0，有一次编过了，另一次报「Unable to find a destination」。默认的那个 GitHub
      # 保证装齐
      - name: 选 Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      # 核对脚本是在 macOS 上写的，没在 Linux 上跑过，所以放在这一段
      - name: 三边核对
        run: bash ios/scripts/check-api.sh
      # 提取头文件那部分要调 clang 读 SDK，所以也放在这一段。bindgen 读手写的
      # 类型定义用的是验收钉住的 typescript，所以先装验收的依赖
      - name: bindgen 的用例
        run: |
          (cd acceptance && npm ci)
          node --test ios/scripts/bindgen/test/*.test.mjs
      - name: 装 XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: ios/Vendor/.v8-cache
          key: v8-${{ hashFiles('ios/scripts/fetch-v8.sh') }}
      - name: 取 V8
        run: bash ios/scripts/fetch-v8.sh
      - name: 从源码打包运行时和能力包
        run: bash ios/scripts/build-xcframework.sh
      # 日志要登录才能读，批注是公开的：把打出来的东西列成一条批注，
      # 这一步之前不管成功还是失败都跑
      - name: 打出来了什么
        if: always()
        run: |
          built="$(for f in packages/*/*.xcframework; do [ -d "$f" ] && echo "$(basename "$f") $(du -sh "$f" | cut -f1)"; done | tr '\n' ';')"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') | 打出来的 framework：${built:-一个都没有}"
      - name: 核对每个包齐不齐
        run: node scripts/release.mjs check
      - name: 演练：只装打出来的包，生成工程并编译
        run: bash scripts/smoke.sh
