# Nacre iOS 运行时工程（XcodeGen）
# 生成工程：xcodegen generate
name: Nacre

options:
  bundleIdPrefix: com.orbitlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  # 运行时。它就是交付物 Nacre.xcframework 的源——凡是这个 target 里的
  # 文件，用户都会拿到；App 那个 target 里的不会。
  #
  # 先做成 dynamic framework：资源（Builtin/nacre.js）跟着 framework 走，
  # 定位是确定的。static 的启动和体积可能更好，但两样都没有数据，等这一步
  # 量出来再对比。
  Nacre:
    type: framework
    platform: iOS
    sources:
      # 两个公开头单独列（见下），所以这里先排除掉
      - path: Runtime
        excludes:
          - "Builtin/**"
          - "Nacre.h"
          - "NacreRuntime.h"
        headerVisibility: project
      - path: Runtime/Nacre.h
        headerVisibility: public
      - path: Runtime/NacreRuntime.h
        headerVisibility: public
      # 内置脚本，在 main.js 之前执行。打进 framework 自己的包，
      # 运行时用 bundleForClass: 找它
      - path: Runtime/Builtin
        type: folder
        buildPhase: resources
    # 系统框架在这里显式声明。
    #
    # 以前不用写：App target 里有 Swift 文件 import UIKit，顺带把 UIKit 和
    # QuartzCore 链进来了。运行时里**一个 Swift 文件都没有**，而 ObjC++ 的
    # #import 不触发自动链接，所以全部要列出来——第一次编 framework 就撞了
    # 一屏 Undefined symbols。
    #
    # 这张表就是交付清单的一部分：用户的工程不用再写它们，framework 自带。
    dependencies:
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      # CGRectZero 这类符号在 CoreGraphics 里，UIKit 只是把头转出来
      - sdk: CoreGraphics.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitlabs.nacre.runtime
        # 生成 module map，宿主才能 import Nacre
        DEFINES_MODULE: YES
        # Info.plist 让 Xcode 自己生成，不往运行时目录里放生成物——
        # 这个目录是交付面，里面的东西都会被用户拿到
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # C++ / V8。这些只有运行时需要，宿主工程不用配
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-fno-rtti"]
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/v8/include"]
        # 按平台选择 V8 静态库：Vendor/v8/lib/iphoneos 或 Vendor/v8/lib/iphonesimulator
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/v8/lib/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
          # Chromium 的 zlib（V8 的快照校验和反优化数据解压依赖它）
          - "-lzip"
          - "-lv8_libbase"
          - "-lv8_libplatform"
          - "-lv8_base_without_compiler"
          - "-lv8_compiler"
          - "-lv8_bigint"
          - "-lv8_snapshot"
          - "-lv8_third_party"
          - "-lcppgc_base"
          - "-ltorque_generated_initializers"
          - "-ltorque_generated_definitions"
          - "-lv8_heap_base"
          - "-lcrdtp"
          - "-lcrdtp_platform"
          - "-linspector"
          - "-linspector_string_conversions"

  # 验收 App。它是运行时的宿主，**不是交付物**——将来这几个文件会变成
  # 模板（packages/ios/template/），由 CLI 铺进生成的工程里。
  NacreApp:
    type: application
    platform: iOS
    sources:
      - path: App
      # JS 目录整体作为资源打进 App Bundle（Bundle 内路径为 JS/）
      - path: JS
        type: folder
        buildPhase: resources
    dependencies:
      - target: Nacre
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nacre
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitlabs.nacre.dev
        # 产物仍然叫 Nacre.app，脚本里的路径不用改
        PRODUCT_NAME: Nacre
        # 模块名要和 framework 的 Nacre 区分开，否则 App 里的 import Nacre
        # 变成导入它自己（Swift 报 cannot find 'NacreRuntime' in scope）
        PRODUCT_MODULE_NAME: NacreApp
        # 宿主必须照做的两条，framework 替不了：
        #
        # JS 跑在主线程，而真机 iOS 的主线程栈默认只有 1MB，V8 按约 1MB 计算
        # 栈上限，没有余量。-stack_size 把它写进 LC_MAIN，而 LC_MAIN 只有
        # **主可执行文件**有，所以这条只能设在 App 上。
        # 代价：必须关掉 Xcode 的 debug dylib，否则链接器报
        # "-stack_size option can only be used when linking a main executable"。
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-stack_size,0x800000"]
        TARGETED_DEVICE_FAMILY: "1"
        # App 图标：App/Assets.xcassets/AppIcon.appiconset（浅色、深色、着色三种外观）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"

settings:
  base:
    # 只支持 arm64（真机 + Apple Silicon 模拟器）
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
