<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Nacre 的 logo：括号和珍珠是镂空的窗口，透出底下的一整片颜色。
       和首页里的 nh-logo（.vitepress/theme/home/NacreHome.vue）是同一套形状和颜色 -->
  <defs>
    <radialGradient id="sky"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="sheen" cx=".42" cy=".4" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#000"/>
      <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 20 Q24 20 24 36 L24 48 Q24 60 13 60 Q24 60 24 72 L24 84 Q24 100 38 100"/>
        <path d="M82 20 Q96 20 96 36 L96 48 Q96 60 107 60 Q96 60 96 72 L96 84 Q96 100 82 100"/>
      </g>
      <circle cx="60" cy="60" r="21" fill="#fff"/>
    </mask>
  </defs>
  <g mask="url(#shape)">
    <rect width="120" height="120" fill="#6366f1"/>
    <circle cx="104" cy="16" r="78" fill="url(#sky)"/>
    <circle cx="14" cy="108" r="80" fill="url(#green)"/>
    <circle cx="114" cy="112" r="70" fill="url(#pink)"/>
  </g>
  <circle cx="60" cy="60" r="21" fill="url(#sheen)"/>
</svg>
